<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="synapseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Synaptic Network Visual -->
  <g filter="url(#glow)">
    <!-- Interconnecting neural pathways -->
    <path d="M 140 370 Q 256 310 256 220 Q 256 140 372 140" stroke="url(#synapseGrad)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 372 370 Q 256 310 256 220" stroke="url(#synapseGrad)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 140 140 Q 256 160 256 220" stroke="url(#synapseGrad)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 256 220 L 256 410" stroke="url(#synapseGrad)" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- Neural Nodes -->
    <!-- Central Master Node -->
    <circle cx="256" cy="220" r="32" fill="#090d16" stroke="#fbbf24" stroke-width="8"/>
    <circle cx="256" cy="220" r="16" fill="#fbbf24"/>

    <!-- Top Left Node -->
    <circle cx="140" cy="140" r="22" fill="#090d16" stroke="#38bdf8" stroke-width="6"/>
    <circle cx="140" cy="140" r="10" fill="#38bdf8"/>

    <!-- Top Right Node -->
    <circle cx="372" cy="140" r="22" fill="#090d16" stroke="#fbbf24" stroke-width="6"/>
    <circle cx="372" cy="140" r="10" fill="#fbbf24"/>

    <!-- Bottom Left Node -->
    <circle cx="140" cy="370" r="22" fill="#090d16" stroke="#38bdf8" stroke-width="6"/>
    <circle cx="140" cy="370" r="10" fill="#38bdf8"/>

    <!-- Bottom Right Node -->
    <circle cx="372" cy="370" r="22" fill="#090d16" stroke="#fbbf24" stroke-width="6"/>
    <circle cx="372" cy="370" r="10" fill="#fbbf24"/>

    <!-- Bottom Stem Node -->
    <circle cx="256" cy="410" r="18" fill="#090d16" stroke="#38bdf8" stroke-width="6"/>
    <circle cx="256" cy="410" r="8" fill="#38bdf8"/>
  </g>
</svg>
